apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hospital-data-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hospital-appointment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hospital-appointment
  template:
    metadata:
      labels:
        app: hospital-appointment
    spec:
      containers:
        - name: hospital-container
          image: hospital-appointment-devops:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000

          env:
            - name: PORT
              value: "3000"

          volumeMounts:
            - name: hospital-storage
              mountPath: /app/data

          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 20

      volumes:
        - name: hospital-storage
          persistentVolumeClaim:
            claimName: hospital-data-pvc

---
apiVersion: v1
kind: Service
metadata:
  name: hospital-service
spec:
  type: NodePort
  selector:
    app: hospital-appointment
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 30080